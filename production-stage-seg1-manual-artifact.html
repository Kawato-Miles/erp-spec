<title>生產階段段 1 驗證操作手冊</title>

<style>
/* ═══════════════════════════════════════════════════════════
   色票：印刷校樣語彙
   紙白 / 墨黑 / 版線 / 青版藍（主動作）/ 洋紅版（警示）
   角色標記色＝七個印版色標，只用於色條，不做滿版底色
   ═══════════════════════════════════════════════════════════ */
:root{
  color-scheme:light dark;

  --paper:#FAF9F6;
  --ink:#16161A;
  --ink-soft:#5C5A57;
  --rule:#E2DFD9;
  --accent:#0B5FD9;
  --flag:#C2185B;

  --surface:#FFFFFF;
  --zebra:#F2F0EA;
  --sunk:#F1EFE8;
  --accent-wash:#ECF2FD;
  --shade:rgba(22,22,26,.10);

  --plate-sales:#0B99D6;
  --plate-order_manager:#D6006E;
  --plate-print_manager:#E8A400;
  --plate-print_officer:#16161A;
  --plate-production_planner:#E2571E;
  --plate-picker:#0E8C6A;
  --plate-cross:#6B4FBB;

  --font-ui:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,monospace;

  --head-h:112px;
  --rail-w:266px;
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#14141A;
    --ink:#ECEAE5;
    --ink-soft:#9A968E;
    --rule:#2B2B33;
    --accent:#5B9CFF;
    --flag:#FF6B9D;

    --surface:#1A1A21;
    --zebra:#1C1C24;
    --sunk:#1E1E27;
    --accent-wash:#1B2434;
    --shade:rgba(0,0,0,.45);

    --plate-print_officer:#ECEAE5;
  }
}
:root[data-theme="dark"]{
  --paper:#14141A;
  --ink:#ECEAE5;
  --ink-soft:#9A968E;
  --rule:#2B2B33;
  --accent:#5B9CFF;
  --flag:#FF6B9D;

  --surface:#1A1A21;
  --zebra:#1C1C24;
  --sunk:#1E1E27;
  --accent-wash:#1B2434;
  --shade:rgba(0,0,0,.45);

  --plate-print_officer:#ECEAE5;
}
:root[data-theme="light"]{
  --paper:#FAF9F6;
  --ink:#16161A;
  --ink-soft:#5C5A57;
  --rule:#E2DFD9;
  --accent:#0B5FD9;
  --flag:#C2185B;

  --surface:#FFFFFF;
  --zebra:#F2F0EA;
  --sunk:#F1EFE8;
  --accent-wash:#ECF2FD;
  --shade:rgba(22,22,26,.10);

  --plate-print_officer:#16161A;
}

/* 角色 → 印版色標 */
[data-plate="sales"]{--plate:var(--plate-sales)}
[data-plate="order_manager"]{--plate:var(--plate-order_manager)}
[data-plate="print_manager"]{--plate:var(--plate-print_manager)}
[data-plate="print_officer"]{--plate:var(--plate-print_officer)}
[data-plate="production_planner"]{--plate:var(--plate-production_planner)}
[data-plate="picker"]{--plate:var(--plate-picker)}
[data-plate="cross"]{--plate:var(--plate-cross)}

/* ═══ 基礎 ═══ */
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:15.5px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

.num{
  font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;
  font-size:.92em;
  letter-spacing:-.01em;
}
a.path{overflow-wrap:anywhere}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none !important}

/* ═══ 報頭 ═══ */
.masthead{
  position:sticky;top:0;z-index:30;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:10px 24px;
  padding:13px 24px 11px;
}
.mast-id{display:grid;gap:2px;min-width:0}
.mast-id h1{
  margin:0;
  font-size:clamp(15px,1.5vw,17px);
  font-weight:700;
  letter-spacing:.01em;
  line-height:1.35;
  text-wrap:balance;
}
.mast-sub{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5}
.mast-tools{display:flex;align-items:center;gap:8px}

#search{
  width:216px;max-width:42vw;
  padding:6px 10px;
  border:1px solid var(--rule);
  border-radius:2px;
  background:var(--surface);
  color:var(--ink);
  font-family:inherit;font-size:13px;
}
#search::placeholder{color:var(--ink-soft)}
#search:focus-visible{border-color:var(--accent)}
.btn{
  padding:6px 11px;
  border:1px solid var(--rule);
  border-radius:2px;
  background:var(--surface);
  color:var(--ink-soft);
  font-family:inherit;font-size:12.5px;
  cursor:pointer;
  transition:color .15s ease,border-color .15s ease;
}
.btn:hover{color:var(--accent);border-color:var(--accent)}

/* ═══ 濃度條：本頁唯一的視覺主張 ═══ */
.tone{
  grid-column:1 / -1;
  display:flex;align-items:center;flex-wrap:wrap;
  gap:6px 14px;
}
.tone-strip{display:flex;flex-wrap:wrap;gap:4px 11px}
.tone-group{display:flex;gap:3px}
.tone-cell{
  width:9px;height:17px;
  border:1px solid var(--rule);
  background:transparent;
  transition:background-color .18s ease,border-color .18s ease;
}
.tone-cell.on{
  background:var(--plate);
  border-color:var(--plate);
}
.tone-label{font-size:12px;color:var(--ink-soft);white-space:nowrap}

/* ═══ 版面 ═══ */
.layout{
  display:grid;
  grid-template-columns:var(--rail-w) minmax(0,1fr);
  align-items:start;
}

/* ═══ 側欄：角色 → 情境 ═══ */
.sidebar{
  position:sticky;top:var(--head-h);
  height:calc(100vh - var(--head-h));
  display:flex;flex-direction:column;
  border-right:1px solid var(--rule);
  padding:12px 10px 0;
  overflow:hidden;
}
.sb-scroll{flex:1 1 auto;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.sb-hint{margin:0;padding:0 8px;font-size:11.5px;line-height:1.65;color:var(--ink-soft)}
.sb-home{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:7px 9px;
  border:0;border-radius:3px;
  background:transparent;color:var(--ink-soft);
  font-family:inherit;font-size:12.8px;font-weight:600;
  text-align:left;cursor:pointer;
}
.sb-home:hover{color:var(--accent)}
.sb-home::before{content:"";width:3px;height:13px;background:var(--rule);flex:0 0 auto}
.sb-home:hover::before{background:var(--accent)}

#nav{display:flex;flex-direction:column;gap:1px}
.role-group{min-width:0}
.role-head{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:7px 9px;
  border:0;border-radius:3px;
  background:transparent;color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:600;
  text-align:left;cursor:pointer;
}
.role-head:hover{background:var(--sunk)}
.plate-bar{flex:0 0 auto;width:3px;height:14px;background:var(--plate,var(--ink-soft))}
.role-head .caret{
  flex:0 0 auto;width:9px;
  font-size:9px;color:var(--ink-soft);
  transition:transform .15s ease;
}
.role-group.open .role-head .caret{transform:rotate(90deg)}
.role-head .count{
  margin-left:auto;
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:11px;color:var(--ink-soft);
}
.scn-list{display:none;margin:0;padding:1px 0 7px 12px;list-style:none}
.role-group.open .scn-list{display:block}
.scn-btn{
  display:flex;align-items:flex-start;gap:8px;
  width:100%;padding:6px 8px 6px 10px;
  border:0;border-left:1px solid var(--rule);border-radius:0 3px 3px 0;
  background:transparent;color:var(--ink-soft);
  font-family:inherit;font-size:12.8px;line-height:1.5;
  text-align:left;cursor:pointer;
}
.scn-btn:hover{background:var(--sunk);color:var(--ink)}
.scn-btn.active{
  background:var(--sunk);color:var(--ink);font-weight:600;
  border-left:2px solid var(--plate);padding-left:9px;
}
.scn-btn .mark{
  flex:0 0 auto;width:7px;height:7px;margin-top:7px;
  border:1px solid var(--rule);
}
.scn-btn.done .mark{background:var(--plate);border-color:var(--plate)}

.sb-foot{
  flex:0 0 auto;
  display:grid;gap:5px;
  padding:11px 9px 13px;
  border-top:1px solid var(--rule);
  background:var(--paper);
}
.foot-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.foot-label{font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
.foot-num{font-size:12px;color:var(--ink)}
.foot-track{height:3px;background:var(--rule)}
.foot-fill{height:100%;width:0;background:var(--accent);transition:width .25s ease}

/* ═══ 內容區 ═══ */
.content{min-width:0;padding:28px 30px 96px;max-width:1060px}

.scn{
  display:grid;gap:26px;
  border-left:3px solid var(--plate,var(--rule));
  padding-left:22px;
}
.scn-head{display:grid;gap:9px}
.crumb{margin:0;font-size:12px;color:var(--ink-soft)}
.scn-head h2{
  margin:0;
  font-size:clamp(20px,2.3vw,25px);
  font-weight:700;line-height:1.35;letter-spacing:.01em;
  text-wrap:balance;
}
.scn-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.badge-role{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;
  padding:3px 9px;
}
.badge-role .chip{width:8px;height:8px;background:var(--plate,var(--ink-soft))}
.badge-role .who{color:var(--ink-soft)}
.tag-supp{
  display:inline-block;
  font-size:11.5px;color:var(--flag);
  border:1px solid var(--flag);border-radius:2px;
  padding:2px 8px;
}
.switch-note{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.65}
.verify{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  margin-top:3px;padding:9px 12px;
  border:1px solid var(--rule);border-radius:2px;
  background:var(--surface);
  font-size:13.5px;font-weight:600;
  cursor:pointer;width:fit-content;max-width:100%;
}
.verify input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.verify .memo{font-size:12px;font-weight:400;color:var(--ink-soft)}

.sec{display:grid;gap:11px}
.sec > h3{
  margin:0;
  font-size:12px;font-weight:700;
  letter-spacing:.09em;color:var(--ink-soft);
}
.sec p{margin:0;max-width:66ch}
.sec .lede{max-width:64ch}

ul.points{display:grid;gap:7px;margin:0;padding:0;list-style:none;max-width:70ch}
ul.points li{position:relative;padding-left:17px}
ul.points li::before{
  content:"";position:absolute;left:1px;top:.68em;
  width:5px;height:5px;border:1px solid var(--ink-soft);
}
ul.prereq{display:grid;gap:7px;margin:0;padding:0;list-style:none;max-width:70ch}
ul.prereq li{position:relative;padding-left:17px}
ul.prereq li::before{
  content:"";position:absolute;left:1px;top:.62em;
  width:6px;height:6px;border:1px solid var(--accent);border-radius:50%;
}
.xlink{
  padding:0;border:0;background:transparent;
  color:var(--accent);font-family:inherit;font-size:inherit;line-height:inherit;
  text-align:left;text-decoration:underline;text-underline-offset:2px;
  cursor:pointer;
}
.xlink:hover{text-decoration-thickness:2px}

/* ═══ 步驟表 ═══ */
.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:2px}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
thead th{
  padding:9px 12px;
  background:var(--sunk);
  border-bottom:1px solid var(--rule);
  font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);
  text-align:left;white-space:nowrap;
}
tbody td{padding:10px 12px;border-top:1px solid var(--rule);vertical-align:top;line-height:1.62}
tbody tr:nth-child(even){background:var(--zebra)}
td.col-no{
  width:46px;text-align:center;color:var(--ink-soft);
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
}
td.col-where{width:196px;overflow-wrap:anywhere}
td.col-do{width:274px}

/* ═══ 總覽頁 ═══ */
.home{display:grid;gap:26px;max-width:860px}
.home-head{display:grid;gap:8px}
.home-head h2{
  margin:0;font-size:clamp(21px,2.6vw,27px);
  font-weight:700;line-height:1.3;letter-spacing:.01em;text-wrap:balance;
}
.home-head .eyebrow{margin:0;font-size:12px;letter-spacing:.09em;color:var(--ink-soft)}
ol.steps{display:grid;gap:7px;margin:0;padding:0;list-style:none;counter-reset:s;max-width:70ch}
ol.steps li{position:relative;padding-left:26px;counter-increment:s}
ol.steps li::before{
  content:counter(s,decimal-leading-zero);
  position:absolute;left:0;top:.06em;
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);
}
.home .table-wrap table{min-width:640px}
.cell-role{display:flex;align-items:center;gap:8px;white-space:nowrap}
.cell-role .chip{width:3px;height:13px;background:var(--plate,var(--ink-soft));flex:0 0 auto}
td.col-num{
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  text-align:right;width:64px;
}
footer{
  margin:0;padding-top:16px;
  border-top:1px solid var(--rule);
  font-size:12px;color:var(--ink-soft);line-height:1.65;
}

/* ═══ 跳轉高亮 ═══ */
@keyframes flash-in{
  0%{background:var(--accent-wash)}
  100%{background:transparent}
}
.scn.flash{animation:flash-in 1.5s ease-out}

/* ═══ 窄視窗：側欄收為頂部橫向角色列 ═══ */
@media (min-width:901px){
  .sidebar.filtered .role-group .scn-list{display:block}
}
@media (max-width:900px){
  .masthead{grid-template-columns:minmax(0,1fr);padding:11px 14px 10px}
  .mast-tools{flex-wrap:wrap}
  #search{width:100%;max-width:none;flex:1 1 160px}
  .layout{display:block}
  .sidebar{
    position:sticky;top:var(--head-h);z-index:20;
    height:auto;
    display:block;
    background:var(--paper);
    border-right:0;border-bottom:1px solid var(--rule);
    padding:8px 14px 9px;
    overflow:visible;
  }
  .sb-scroll{display:block;overflow:visible}
  .sb-hint,.sb-foot,.sb-home{display:none}
  #nav{
    flex-direction:row;flex-wrap:nowrap;gap:6px;
    overflow-x:auto;overflow-y:hidden;
    padding-bottom:2px;
  }
  .role-group{flex:0 0 auto}
  .role-head{
    border:1px solid var(--rule);border-radius:99px;
    padding:6px 12px;white-space:nowrap;font-size:13px;
  }
  .role-group.open .role-head{border-color:var(--plate)}
  .role-head .caret{display:none}
  .scn-list{
    position:absolute;left:14px;right:14px;top:calc(100% - 5px);z-index:25;
    max-height:56vh;overflow-y:auto;
    padding:6px;
    background:var(--surface);
    border:1px solid var(--rule);border-radius:3px;
    box-shadow:0 10px 26px var(--shade);
  }
  .content{padding:20px 14px 72px}
  .scn{padding-left:14px;gap:22px}
  table{min-width:660px}
  td.col-where{width:170px}
  td.col-do{width:230px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    transition-duration:.001ms !important;
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
  }
}
</style>

<script>
/* ─────────────────────────────────────────────
   資料：角色 → 情境
   來源：ACCEPTANCE.md（86 項驗收）、段 1 商業層設計、wiki 角色卡與情境卡
   ───────────────────────────────────────────── */
const DATA = [
{
  key:'sales', role:'業務', user:'洪嘉駿',
  pos:'公司接單與收款的第一線，從接到客戶需求一路跟到收款與售後。',
  duty:'可建可改需求單、訂單（含印件與稿件上傳）、訂單異動、收款與發票、售後服務單、出貨單；工單進度與品檢紀錄只查閱、不能動；不接觸生產排程、派工與報工。',
  scenarios:[
  {
    id:'sales-thread', title:'如何建立製作討論串', supp:true,
    intro:'印件審稿通過後，訂單管理人核對製作細節時可能對規格備註、數量、單位有疑義。業務先在訂單詳情頁替這些印件開好 Slack 製作討論串，讓疑義有地方談。討論串是可選輔助，不是必經前置。',
    points:[
      '分辨製作討論串與審稿討論串：前者一印件一串、談這件的規格內容；後者一串多印件、談審核先後順序',
      '知道勾選是批次、產出是逐件——勾三件建三串',
      '知道已有討論串的印件會被略過，不重複建立，也不提供重建動作',
      '知道建串會 mention 訂單管理人黃聖雯與 #印務部 頻道',
      '知道連結會回寫到印件，出現在訂單詳情印件列、待確認製作細節佇列、印件詳情頁三處',
      '知道 Prototype 不真實呼叫 Slack，只產生模擬連結'
    ],
    prereq:null,
    steps:[

/* ─────────────────────────────────────────────
   渲染
   ───────────────────────────────────────────── */
const BASE='http://localhost:3000';
const STORE_KEY='seg1-manual-progress-v1';
let progress={};
try{progress=JSON.parse(localStorage.getItem(STORE_KEY))||{}}catch(e){progress={}}

const ALL=[];
DATA.forEach(g=>g.scenarios.forEach(s=>ALL.push({...s,roleKey:g.key,role:g.role,user:g.user})));
const byId=id=>ALL.find(s=>s.id===id);

const noMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isNarrow=()=>window.innerWidth<=900;

/* 把 [[/path]] 轉成完整可點連結 */
function linkify(t){
  return String(t).replace(/\[\[(\/[^\]]*)\]\]/g,(m,p)=>
    '<a class="num path" href="'+BASE+p+'" target="_blank" rel="noopener">'+BASE+p+'</a>');
}
/* 業務編號以等寬字呈現：只動標籤外的文字節點，不碰屬性值 */
const CODE_RE=/\b((?:PI|WO|DO|ORD|PS|BR|SO|QR|AFT|PO)-\d{4}-[0-9A-Z]{2,6})\b/g;
function markCodes(html){
  return html.split(/(<[^>]*>)/).map(part=>
    part.charAt(0)==='<' ? part : part.replace(CODE_RE,'<span class="num">$1</span>')
  ).join('');
}
const rich=t=>markCodes(linkify(t));

const navEl=document.getElementById('nav');
const contentEl=document.getElementById('content');
const sidebarEl=document.getElementById('sidebar');
const toneEl=document.getElementById('toneStrip');

/* ── 側欄目錄 ── */
function buildNav(){
  navEl.innerHTML=DATA.map(g=>
    '<div class="role-group" data-role="'+g.key+'" data-plate="'+g.key+'">'+
      '<button class="role-head" type="button">'+
        '<i class="plate-bar" aria-hidden="true"></i>'+
        '<span class="caret" aria-hidden="true">&#9656;</span>'+
        '<span>'+g.role+'</span>'+
        '<span class="count">'+g.scenarios.length+'</span>'+
      '</button>'+
      '<ul class="scn-list">'+g.scenarios.map(s=>
        '<li><button class="scn-btn" type="button" data-scn="'+s.id+'">'+
        '<span class="mark" aria-hidden="true"></span><span class="txt">'+s.title+'</span></button></li>').join('')+
      '</ul>'+
    '</div>').join('');
}

/* ── 濃度條：一格一情境，依角色分組 ── */
function buildTone(){
  toneEl.innerHTML=DATA.map(g=>
    '<span class="tone-group" data-plate="'+g.key+'">'+
      g.scenarios.map(s=>
        '<span class="tone-cell" data-cell="'+s.id+'" title="'+g.role+'：'+s.title+'"></span>').join('')+
    '</span>').join('');
}

function renderProgress(){
  const done=ALL.filter(s=>progress[s.id]).length;
  document.getElementById('ptext').textContent='已驗證 '+done+' / 全部 '+ALL.length;
  document.getElementById('pfoot').textContent=done+' / '+ALL.length;
  document.getElementById('pfill').style.width=(ALL.length?(done/ALL.length*100):0)+'%';
  document.querySelectorAll('.tone-cell').forEach(c=>
    c.classList.toggle('on',!!progress[c.dataset.cell]));
  document.querySelectorAll('.scn-btn').forEach(b=>
    b.classList.toggle('done',!!progress[b.dataset.scn]));
}

function openRoleOf(id){
  const s=byId(id);
  document.querySelectorAll('.role-group').forEach(g=>{
    if(g.dataset.role===s.roleKey) g.classList.add('open');
    else if(isNarrow()) g.classList.remove('open');
  });
}

/* ── 情境內容 ── */
function renderScenario(id,flash){
  const s=byId(id);
  if(!s){renderHome();return;}
  const prereqHtml = s.prereq && s.prereq.length
    ? '<ul class="prereq">'+s.prereq.map(p=>
        '<li><button class="xlink" type="button" data-goto="'+p[0]+'">'+markCodes(p[1])+'</button></li>').join('')+'</ul>'
    : '<p>無，這是起點。</p>';

  const rows=s.steps.map(st=>
    '<tr><td class="col-no">'+st[0]+'</td>'+
    '<td class="col-where">'+rich(st[1])+'</td>'+
    '<td class="col-do">'+rich(st[2])+'</td>'+
    '<td>'+rich(st[3])+'</td></tr>').join('');

  contentEl.innerHTML=
    '<article class="scn" id="scnDoc" data-plate="'+s.roleKey+'">'+
      '<header class="scn-head">'+
        '<p class="crumb">'+s.role+' &rsaquo; '+s.title+'</p>'+
        '<h2>'+s.title+'</h2>'+
        '<div class="scn-meta">'+
          '<span class="badge-role"><i class="chip" aria-hidden="true"></i>登入角色：'+s.role+
            '<span class="who">'+(s.user?'（'+s.user+'）':'')+'</span></span>'+
          (s.supp?'<span class="tag-supp">依設計補寫，ACCEPTANCE 未列</span>':'')+
        '</div>'+
        '<p class="switch-note">在 prototype 右上角切換模擬角色；模擬資料存在記憶體，重新整理頁面即重置，單一情境請一氣呵成。</p>'+
        '<label class="verify"><input type="checkbox" id="chk" '+(progress[s.id]?'checked':'')+'>已驗證'+
          '<span class="memo">勾選狀態存在瀏覽器，重開仍在</span></label>'+
      '</header>'+
      '<section class="sec"><h3>這個情境在做什麼</h3><p class="lede">'+markCodes(s.intro)+'</p></section>'+
      '<section class="sec"><h3>重點</h3><ul class="points">'+
        s.points.map(p=>'<li>'+markCodes(p)+'</li>').join('')+'</ul></section>'+
      '<section class="sec"><h3>前置情境</h3>'+prereqHtml+'</section>'+
      '<section class="sec"><h3>怎麼操作</h3><div class="table-wrap"><table>'+
        '<thead><tr><th>步驟</th><th>在哪個畫面</th><th>做什麼</th><th>預期看到什麼</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table></div></section>'+
    '</article>';

  document.getElementById('chk').addEventListener('change',e=>{
    if(e.target.checked) progress[s.id]=true; else delete progress[s.id];
    localStorage.setItem(STORE_KEY,JSON.stringify(progress));
    renderProgress();
  });
  contentEl.querySelectorAll('[data-goto]').forEach(b=>
    b.addEventListener('click',()=>select(b.dataset.goto,true)));

  document.querySelectorAll('.scn-btn').forEach(b=>
    b.classList.toggle('active',b.dataset.scn===id));
  openRoleOf(id);
  renderProgress();

  window.scrollTo({top:0,behavior:(flash && !noMotion)?'smooth':'auto'});
  if(flash && !noMotion){
    const doc=document.getElementById('scnDoc');
    doc.classList.add('flash');
    setTimeout(()=>doc.classList.remove('flash'),1600);
  }
}

/* ── 總覽 ── */
function renderHome(){
  contentEl.innerHTML=
   '<div class="home">'+
   '<header class="home-head">'+
     '<p class="eyebrow">段 1 驗證</p>'+
     '<h2>生產階段 段 1 Prototype 驗證操作手冊</h2>'+
   '</header>'+
   '<section class="sec"><h3>這份手冊怎麼用</h3>'+
   '<ol class="steps">'+
   '<li>啟動 prototype：在 erp repo 執行 <span class="num">pnpm dev:erp</span>，開 <a class="num path" href="'+BASE+'" target="_blank" rel="noopener">'+BASE+'</a> 並登入。</li>'+
   '<li>左側選角色、再選情境。每個情境固定四段：這個情境在做什麼、重點、前置情境、怎麼操作。</li>'+
   '<li>每一步都標了要切到哪個模擬角色，切換器在 prototype 右上角。</li>'+
   '<li>驗證完一個情境就勾「已驗證」，進度存在瀏覽器，重開仍在，頂部顯示總進度。</li>'+
   '<li>搜尋框會同時過濾情境標題與重點文字。</li>'+
   '</ol></section>'+
   '<section class="sec"><h3>驗證前要知道的三件事</h3>'+
   '<ul class="points">'+
   '<li>模擬資料存在記憶體，重新整理頁面即重置，單一情境請一氣呵成走完。</li>'+
   '<li>各模組自帶模擬資料，但編號是同一套（印件 PI-[年]-[四碼]、工單 WO-[年]-[四碼]、配方 PS- / BR-），跨模組一律以編號認人。</li>'+
   '<li>已連動的是段 1 主線：訂單 → 工單 → 印件總覽 → 生管待派 → 派單點收。品檢入庫累計反映在出貨管理的額度、不反映在印件總覽，這是已知的模擬資料邊界、不是缺陷。</li>'+
   '</ul></section>'+
   '<section class="sec"><h3>涵蓋範圍</h3>'+
   '<div class="table-wrap"><table>'+
   '<thead><tr><th>角色</th><th>模擬使用者</th><th>情境數</th><th>一句話定位</th></tr></thead><tbody>'+
   DATA.map(g=>'<tr>'+
     '<td><span class="cell-role" data-plate="'+g.key+'"><i class="chip" aria-hidden="true"></i>'+g.role+'</span></td>'+
     '<td>'+g.user+'</td>'+
     '<td class="col-num">'+g.scenarios.length+'</td>'+
     '<td>'+g.pos+'</td></tr>').join('')+
   '</tbody></table></div></section>'+
   '<footer>資料來源：erp repo 的 ACCEPTANCE.md（86 項驗收操作）、生產階段校正 段 1 商業層設計、wiki 角色卡與情境卡。</footer>'+
   '</div>';
  document.querySelectorAll('.scn-btn').forEach(b=>b.classList.remove('active'));
  renderProgress();
}

function select(id,flash){
  renderScenario(id,flash);
  if(isNarrow()) document.querySelectorAll('.role-group').forEach(g=>g.classList.remove('open'));
}

/* ─── 事件 ─── */
buildNav();
buildTone();

navEl.addEventListener('click',e=>{
  const head=e.target.closest('.role-head');
  if(head){
    const group=head.parentElement;
    const willOpen=!group.classList.contains('open');
    if(isNarrow()) document.querySelectorAll('.role-group').forEach(g=>g.classList.remove('open'));
    group.classList.toggle('open',willOpen);
    return;
  }
  const btn=e.target.closest('.scn-btn');
  if(btn) select(btn.dataset.scn,false);
});

document.getElementById('homeBtn').addEventListener('click',()=>{
  renderHome();
  window.scrollTo({top:0,behavior:noMotion?'auto':'smooth'});
});

document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){
    sidebarEl.classList.remove('filtered');
    document.querySelectorAll('.scn-btn').forEach(b=>b.parentElement.classList.remove('hidden'));
    document.querySelectorAll('.role-group').forEach(g=>g.classList.remove('hidden'));
    return;
  }
  sidebarEl.classList.add('filtered');
  DATA.forEach(g=>{
    let hit=0;
    g.scenarios.forEach(s=>{
      const hay=(s.title+' '+s.points.join(' ')+' '+s.intro+' '+g.role).toLowerCase();
      const li=document.querySelector('.scn-btn[data-scn="'+s.id+'"]').parentElement;
      const match=hay.indexOf(q)>=0;
      li.classList.toggle('hidden',!match);
      if(match) hit++;
    });
    document.querySelector('.role-group[data-role="'+g.key+'"]').classList.toggle('hidden',hit===0);
  });
});

document.getElementById('resetBtn').addEventListener('click',()=>{
  progress={}; localStorage.removeItem(STORE_KEY); renderProgress();
  const c=document.getElementById('chk'); if(c) c.checked=false;
});

/* 報頭高度回寫，供側欄吸附定位 */
const mastEl=document.querySelector('.masthead');
function syncHead(){
  document.documentElement.style.setProperty('--head-h',Math.round(mastEl.getBoundingClientRect().height)+'px');
}
syncHead();
if(window.ResizeObserver) new ResizeObserver(syncHead).observe(mastEl);
window.addEventListener('resize',syncHead);

/* 寬版預設展開第一個角色；窄版角色列為橫向捲動，不預先落下情境面板 */
if(!isNarrow()) document.querySelector('.role-group').classList.add('open');
renderHome();
renderProgress();
