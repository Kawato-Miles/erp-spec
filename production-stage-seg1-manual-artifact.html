<title>感官 ERP 操作手冊</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 文件站版式（參考 GitBook 樣式）：白底、單一主色、三欄 */
:root{
  color-scheme:light;
  --primary:#3C5C9C;
  --primary-soft:#EEF2F9;
  --primary-line:#C9D4EA;
  --text:#1F2A37;
  --text-2:#4B5563;
  --text-3:#6B7280;
  --bg:#FFFFFF;
  --bg-2:#F7F8FA;
  --line:#E5E7EB;
  --line-2:#EEF0F3;
  --ok:#2F7D5B;
  --warn:#B45309;
  --font:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --head-h:64px;
  --nav-w:280px;
  --toc-w:220px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--head-h) + 16px)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none !important}
.num{font-family:var(--mono);font-size:.9em;font-variant-numeric:tabular-nums}
.path{overflow-wrap:anywhere}
button{font-family:inherit}

/* 頂欄 */
.masthead{
  position:sticky;top:0;z-index:30;height:var(--head-h);
  display:flex;align-items:center;gap:20px;
  padding:0 24px;background:var(--bg);border-bottom:1px solid var(--line);
}
.mast-id{display:flex;align-items:center;gap:10px;min-width:0}
.mast-id .logo{
  width:28px;height:28px;border-radius:6px;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;flex:0 0 auto;
}
.mast-id h1{margin:0;font-size:16px;font-weight:600;line-height:1.2;white-space:nowrap}
.mast-sub{display:none}
.mast-tools{margin-left:auto}
#search{
  width:260px;max-width:40vw;padding:8px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg-2);
  color:var(--text);font-size:14px;
}
#search:focus-visible{border-color:var(--primary);background:var(--bg);outline:0;box-shadow:0 0 0 3px var(--primary-soft)}

/* 三欄 */
.layout{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);max-width:1400px;margin:0 auto}
.sidebar{
  position:sticky;top:var(--head-h);height:calc(100vh - var(--head-h));
  overflow:hidden;border-right:1px solid var(--line);padding:16px 12px 0;
}
.sb-scroll{height:100%;overflow-y:auto;padding-bottom:24px;display:flex;flex-direction:column;gap:6px}
.sb-hint{display:none}
.sb-home{
  display:flex;align-items:center;width:100%;padding:7px 12px;border:0;border-radius:6px;
  background:transparent;color:var(--text-2);font-size:14px;text-align:left;cursor:pointer;
}
.sb-home:hover{background:var(--bg-2);color:var(--text)}
.sb-home.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
#nav{display:flex;flex-direction:column;gap:2px}
.unit{display:flex;flex-direction:column;gap:2px;padding:0}
.unit-head{display:none}
.unit-head .carrier{display:none}
.unit-intro-btn,.role-head,.scn-btn{
  display:flex;align-items:center;gap:8px;width:100%;
  border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer;
  color:var(--text-2);font-size:14px;line-height:1.45;
}
.unit-intro-btn{padding:7px 12px}
.unit-intro-btn:hover{background:var(--bg-2);color:var(--text)}
.unit-intro-btn.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.role-head{padding:7px 12px;font-weight:500;color:var(--text)}
.role-head:hover{background:var(--bg-2)}
.plate-bar{display:none}
.role-head .caret{
  margin-left:auto;flex:0 0 auto;width:14px;font-size:10px;color:var(--text-3);
  transition:transform .15s ease;
}
.role-group.open .role-head .caret{transform:rotate(90deg)}
.role-head .count{display:none}
.scn-list{display:none;margin:0;padding:0 0 4px 0;list-style:none}
.role-group.open .scn-list{display:block}
.scn-btn{padding:6px 12px 6px 22px;border-left:3px solid transparent;border-radius:0 6px 6px 0;color:var(--text-2)}
.scn-btn:hover{color:var(--text);background:transparent}
.scn-btn.active{border-left-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.scn-sub{margin:0;padding:0;list-style:none}
.scn-sub .scn-btn{padding-left:34px}
.role-sub{margin:0;padding:6px 12px 6px 22px;border-left:3px solid transparent;font-size:14px;font-weight:400;color:var(--text-2);line-height:1.45}
li.sub{list-style:none}

/* 內容與右側目錄 */
.content{
  min-width:0;display:grid;grid-template-columns:minmax(0,760px) var(--toc-w);
  gap:48px;padding:40px 48px 96px;
}
.doc{min-width:0}
.toc{position:sticky;top:calc(var(--head-h) + 40px);align-self:start;font-size:13px}
.toc h4{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--text-3)}
.toc ul{margin:0;padding:0;list-style:none;border-left:1px solid var(--line)}
.toc li a{display:block;padding:4px 12px;color:var(--text-2);border-left:2px solid transparent;margin-left:-1px}
.toc li a:hover{color:var(--text);text-decoration:none}
.toc li a.active{color:var(--primary);border-left-color:var(--primary)}

.crumb{margin:0 0 12px;font-size:13px;color:var(--text-3)}
.crumb .sep{margin:0 6px}
.doc h1,.scn-head h2,.home-head h2{
  margin:0;font-size:32px;font-weight:700;line-height:1.25;letter-spacing:-.01em;text-wrap:balance;
}
.lede{margin:12px 0 0;font-size:17px;color:var(--text-2);line-height:1.7;max-width:66ch}
.scn{display:grid;gap:0}
.scn-head{padding-bottom:20px;border-bottom:1px solid var(--line)}
.scn-meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:14px;color:var(--text-3)}
.scn-meta .who{color:var(--text-3)}
.badge-role,.tag-carrier,.kind-tag,.tag-supp,.switch-note{display:none}
.roles-line{margin:0;font-size:14px;color:var(--text-3)}
.roles-line b{color:var(--text-2);font-weight:500}

.sec{padding-top:36px}
.sec > h3{
  margin:0 0 14px;font-size:20px;font-weight:600;line-height:1.35;color:var(--text);letter-spacing:-.005em;
}
.sec p{margin:0;max-width:68ch}
.sec .lede{font-size:16px;color:var(--text);margin:0 0 14px}

ul.points,ul.prereq,ul.goals,ul.check{display:grid;gap:8px;margin:0;padding:0 0 0 22px;max-width:68ch;list-style:disc}
ul.points li::marker,ul.prereq li::marker,ul.goals li::marker,ul.check li::marker{color:var(--text-3)}
ul.check{list-style:none;padding-left:0}
ul.check li{position:relative;padding-left:28px}
ul.check li::before{
  content:"";position:absolute;left:1px;top:.4em;width:14px;height:14px;border-radius:50%;
  border:1.5px solid var(--ok);
}
ul.check li::after{
  content:"";position:absolute;left:6px;top:.45em;width:3px;height:7px;
  border:solid var(--ok);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);
}
.xlink{
  padding:0;border:0;background:transparent;color:var(--primary);
  font-size:inherit;line-height:inherit;text-align:left;cursor:pointer;
}
.xlink:hover{text-decoration:underline}

/* 情境框 */
.story{
  margin:0;max-width:68ch;padding:16px 20px;border-radius:8px;
  background:var(--bg-2);border:1px solid var(--line-2);line-height:1.75;
}
.story .who{display:block;font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:6px}

/* 步驟 */
ol.howto{display:grid;gap:18px;margin:0;padding:0;list-style:none;counter-reset:h;max-width:68ch}
ol.howto li{position:relative;padding-left:44px;counter-increment:h}
ol.howto li::before{
  content:counter(h);position:absolute;left:0;top:1px;width:28px;height:28px;
  display:grid;place-items:center;border-radius:50%;
  background:var(--primary);color:#fff;font-size:13px;font-weight:600;
}
ol.howto .do{margin:0;font-weight:500;line-height:1.7}
ol.howto .see{
  margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--line);border-radius:0 6px 6px 0;
  background:var(--bg-2);color:var(--text-2);line-height:1.7;
}
ol.howto .see::before{
  content:"你會看到";display:block;margin-bottom:2px;
  font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text-3);
}
b.ui{font-weight:600;color:var(--text);background:var(--primary-soft);padding:1px 5px;border-radius:4px}

/* 提示框 */
.callout{
  margin:0;max-width:68ch;padding:14px 16px 14px 18px;border-radius:8px;
  border:1px solid var(--primary-line);border-left:4px solid var(--primary);background:var(--primary-soft);
}
.callout h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--primary)}
.callout ul{margin:0;padding-left:18px;display:grid;gap:4px}
.callout li{line-height:1.7}
.callout li::marker{color:var(--primary)}
.faq{max-width:68ch;display:grid;gap:8px}
.faq details{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.faq summary{padding:10px 14px;font-weight:600;color:var(--text);cursor:pointer;line-height:1.6;list-style:none;display:flex;gap:10px;align-items:flex-start}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"";flex:0 0 auto;width:8px;height:8px;margin-top:9px;border-right:1.5px solid var(--text-3);border-bottom:1.5px solid var(--text-3);transform:rotate(-45deg);transition:transform .15s ease}
.faq details[open] summary::before{transform:rotate(45deg)}
.faq details p{margin:0;padding:0 14px 12px 32px;color:var(--text-2);line-height:1.7}

/* 兩欄盒 */
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:68ch}
.two-col .box{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--bg)}
.two-col h4{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--text)}
.two-col ul{margin:0;padding-left:18px;display:grid;gap:4px}
.two-col li{line-height:1.7}

/* 狀態流程圖（SVG） */
.flow{max-width:68ch;margin:0 0 20px;padding:16px 18px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg-2)}
.flow svg{display:block;width:100%;height:auto;font-family:var(--font)}
.flow .fb{fill:var(--bg);stroke:var(--text-3);stroke-width:1.2}
.flow .fb.end{stroke:var(--ok)}
.flow .fb.lost{stroke:#C97B7B}
.flow .ft{fill:var(--text);font-size:13px;font-weight:600}
.flow .ft.end{fill:var(--ok)}
.flow .ft.lost{fill:#A33A3A}
.flow .fa{fill:none;stroke:var(--text-2);stroke-width:1.4}
.flow .fa.dash{stroke-dasharray:4 4;stroke:var(--text-3)}
.flow .fm{fill:var(--text-2)}
.flow .fl{fill:var(--primary);font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--bg-2);stroke-width:4px;stroke-linejoin:round}
.flow figcaption{margin:10px 0 0;font-size:13px;color:var(--text-3);line-height:1.6}
td.col-yesno{white-space:nowrap;font-weight:600}
td.col-yesno.yes{color:var(--ok)}
td.col-yesno.no{color:var(--text-3)}

/* 概念階段帶：說明各狀態在做什麼、誰負責；不是嚴格流程圖 */
.stages{display:flex;flex-wrap:wrap;gap:10px 0;align-items:stretch;max-width:68ch;margin:0 0 20px}
.stage{flex:1 1 150px;min-width:150px;display:grid;gap:4px;align-content:start;padding:12px 14px 12px;border-top:3px solid var(--primary);background:var(--bg-2);border-radius:0 0 8px 8px;position:relative;margin-right:26px}
.stage:last-child{margin-right:0}
.stage::after{content:"";position:absolute;right:-20px;top:50%;width:10px;height:10px;border-top:1.5px solid var(--text-3);border-right:1.5px solid var(--text-3);transform:translateY(-50%) rotate(45deg)}
.stage:last-child::after{display:none}
.stage .st-name{font-weight:700;font-size:15px;color:var(--text);line-height:1.35}
.stage .st-who{font-size:12px;letter-spacing:.02em;color:var(--primary);font-weight:600}
.stage .st-do{font-size:13px;color:var(--text-2);line-height:1.6}
.stage.side{border-top-color:var(--text-3);border-top-style:dashed;background:transparent;border-left:1px dashed var(--line);border-right:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.stage.side .st-who{color:var(--text-3)}
.stage.end{border-top-color:var(--ok)}
.stages-cap{margin:0 0 20px;font-size:13px;color:var(--text-3);line-height:1.6;max-width:68ch}
ul.result{display:grid;gap:8px;margin:0;padding:0 0 0 22px;max-width:68ch;list-style:disc}
ul.result li::marker{color:var(--text-3)}
ol.howto .tip{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--primary-line);border-radius:0 6px 6px 0;background:var(--primary-soft);color:var(--text-2);line-height:1.7}
ol.howto .tip::before{content:"說明";display:block;margin-bottom:2px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--primary)}
.flow-title{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--text-2)}
/* 表格 */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
thead th{
  padding:10px 14px;background:var(--bg-2);border-bottom:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--text-2);text-align:left;white-space:nowrap;
}
tbody td{padding:10px 14px;border-top:1px solid var(--line-2);vertical-align:top;line-height:1.65}
tbody tr:first-child td{border-top:0}
td.col-no{width:52px;text-align:center;color:var(--text-3);font-family:var(--mono)}
td.col-where{width:200px;overflow-wrap:anywhere;color:var(--text-2)}
td.col-do{width:280px}
td.col-num{font-family:var(--mono);text-align:right;width:64px}
.cell-role .chip{display:none}

/* 上下頁 */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.pager a,.pager button{
  display:grid;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);text-align:left;cursor:pointer;color:var(--text);text-decoration:none;
}
.pager button:hover{border-color:var(--primary-line);background:var(--bg-2)}
.pager .dir{font-size:12px;color:var(--text-3)}
.pager .ttl{font-size:15px;font-weight:600;color:var(--primary)}
.pager .next{text-align:right}

/* 首頁 */
.home{display:grid;gap:0}
.home-head .eyebrow{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{
  display:grid;gap:6px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);text-align:left;cursor:pointer;color:var(--text);
}
.card:hover{border-color:var(--primary-line);background:var(--bg-2)}
.card .ttl{font-size:15px;font-weight:600;color:var(--primary)}
.card .desc{font-size:14px;color:var(--text-2);line-height:1.6}
ol.steps{display:grid;gap:8px;margin:0;padding-left:22px;max-width:68ch}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--text-3);line-height:1.65}

/* 跳轉高亮 */
@keyframes flash-in{0%{background:var(--primary-soft)}100%{background:transparent}}
.scn.flash,.home.flash{animation:flash-in 1.2s ease-out}

/* 窄視窗 */
@media (max-width:1180px){
  .content{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
}
@media (min-width:901px){
  .sidebar.filtered .role-group .scn-list{display:block}
}
@media (max-width:900px){
  .masthead{padding:0 14px;gap:12px}
  #search{width:100%;max-width:none}
  .layout{display:block}
  .sidebar{
    position:sticky;top:var(--head-h);z-index:20;height:auto;border-right:0;border-bottom:1px solid var(--line);
    padding:8px 14px 9px;overflow:visible;background:var(--bg);
  }
  .sb-scroll{display:block;overflow:visible;padding-bottom:0}
  .sb-home{display:none}
  #nav{flex-direction:row;flex-wrap:nowrap;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
  .unit{display:contents}
  .unit-head{flex:0 0 auto;align-self:center;margin:0 4px 0 8px;white-space:nowrap}
  .unit-intro-btn,.role-head{flex:0 0 auto;width:auto;border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .role-group{flex:0 0 auto;position:relative}
  .role-group.open .role-head{border-color:var(--primary);color:var(--primary)}
  .role-head .caret{display:none}
  .scn-list{
    position:absolute;left:0;top:calc(100% + 6px);z-index:25;min-width:260px;max-height:56vh;overflow-y:auto;
    padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 26px rgba(31,42,55,.12);
  }
  .scn-btn{border-left:0}
  .content{padding:24px 16px 72px}
  .doc h1,.scn-head h2,.home-head h2{font-size:26px}
  .pager{grid-template-columns:1fr}
  .pager .next{text-align:left}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.001ms !important;animation-duration:.001ms !important;scroll-behavior:auto !important}
}
</style>

<div class="manual">

  <header class="masthead">
    <div class="mast-id">
      <span class="logo" aria-hidden="true">感</span>
      <h1>感官 ERP 操作手冊</h1>
    </div>
    <div class="mast-tools">
      <label class="sr-only" for="search">搜尋</label>
      <input id="search" type="search" placeholder="搜尋" autocomplete="off">
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="情境目錄">
      <div class="sb-scroll">
        <p class="sb-hint">左側先選單元，再選主題。</p>
        <button class="sb-home" id="homeBtn" type="button">總覽</button>
        <div id="nav"></div>
      </div>
    </nav>

    <main class="content" id="content"></main>
  </div>

</div>

<script>
/* ─────────────────────────────────────────────
   資料：單元 → 主題群 → 頁面（概覽或操作說明）
   內容以 ERP 需求單、訂單、審稿、工單、生產五模組的現行流程為準
   ───────────────────────────────────────────── */
const UNITS = [
{
  key:'u1',
  nav:'單元一　需求單管理',
  title:'單元一　需求單管理（詢價到成交、轉訂單）',
  carrier:'',
  note:'',
  intro:null
},
{ key:'u2', nav:'單元二　訂單管理', title:'單元二　訂單管理（訂單成立到確認製作細節，含款項與發票對帳）', carrier:'', note:'', intro:null },
{ key:'u3', nav:'單元三　審稿管理', title:'單元三　審稿管理（稿件送審到確認可製作）', carrier:'', note:'', intro:null },
{ key:'u4', nav:'單元四　工單管理', title:'單元四　工單管理（工單分派到交付產線）', carrier:'', note:'', intro:null },
{
  key: 'u5',
  nav: '單元五　生產管理',
  title: '單元五　生產管理（工單交付產線到工序全部完成）',
  carrier: '',
  note: '',
  intro: null,
}
];

const DATA = [
 {
  "key": "presales",
  "unit": "u1",
  "role": "需求單管理",
  "user": "業務、印務主管",
  "pos": "業務接客戶詢價，在需求單上定規格、抓成本、報價。客戶談定後，業務把需求單轉成訂單。",
  "duty": "需求單全程由業務維護。印務主管只在成本評估這一關確認成本。先看概覽，再照操作步驟做。",
  "scenarios": [

/* 把 [[/path]] 轉成等寬字路徑（純文字，非連結） */
function linkify(t){
  return String(t).replace(/\[\[(\/[^\]]*)\]\]/g,(m,p)=>
    '<span class="num path">'+p+'</span>');
}
/* 業務編號以等寬字呈現：只動標籤外的文字節點，不碰屬性值 */
const CODE_RE=/\b((?:PI|WO|DO|ORD|PS|BR|SO|QR|AFT|PO)-\d{4}-[0-9A-Z]{2,6})\b/g;
function markCodes(html){
  html=String(html).replace(/\n/g,'<br>');
  return html.split(/(<[^>]*>)/).map(part=>
    part.charAt(0)==='<' ? part : part.replace(CODE_RE,'<span class="num">$1</span>')
  ).join('');
}
const rich=t=>markCodes(linkify(t));

/* ── 側欄目錄 ── */
function buildNav(){
  navEl.innerHTML=UNITS.map(u=>
    '<section class="unit" data-unit="'+u.key+'">'+
      '<h4 class="unit-head">'+u.nav.replace(/\u3000/g,' ')+
        '<span class="carrier">'+u.carrier+'</span>'+
      '</h4>'+
      (u.intro?'<button class="unit-intro-btn" type="button" data-intro="'+u.key+'">單元導讀</button>':'')+
      DATA.filter(g=>g.unit===u.key && !g.parent).map(g=>groupNav(g)).join('')+
    '</section>').join('');
}

function groupNav(g){
  const solo=false;
  return  '<div class="role-group'+(solo?' solo open':'')+'" data-role="'+g.key+'" data-plate="'+g.key+'">'+
      (solo?'':'<button class="role-head" type="button">'+
        '<span>'+g.role+'</span>'+
        '<span class="caret" aria-hidden="true">&#9656;</span>'+
      '</button>')+
      '<ul class="scn-list">'+g.scenarios.map(s=>
        '<li><button class="scn-btn" type="button" data-scn="'+s.id+'">'+
        '<span class="txt">'+s.title+'</span></button></li>').join('')+
        DATA.filter(x=>x.parent===g.key).map(sub=>
          '<li class="sub"><div class="role-sub">'+sub.role+'</div><ul class="scn-sub">'+sub.scenarios.map(s=>
            '<li><button class="scn-btn" type="button" data-scn="'+s.id+'">'+
            '<span class="txt">'+s.title+'</span></button></li>').join('')+'</ul></li>').join('')+
      '</ul>'+
    '</div>';
}

function openRoleOf(id){
  const s=byId(id);
  const grp=DATA.find(g=>g.key===s.roleKey); const top=(grp&&grp.parent)||s.roleKey;
  document.querySelectorAll('.role-group').forEach(g=>g.classList.toggle('open',g.dataset.role===top));
}



/* 頁面骨架：正文 + 右側目錄 + 上下頁 */
function wrapDoc(inner){
  return '<div class="doc" id="scnDoc">'+inner+'</div><aside class="toc" id="toc"></aside>';
}
function orderOf(){ return ALL.map(x=>x.id); }
function pagerHtml(id){
  const order=orderOf(); const k=order.indexOf(id);
  const prev=k>0?byId(order[k-1]):null, next=k<order.length-1?byId(order[k+1]):null;
  return '<nav class="pager" aria-label="上下頁">'+
    (prev?'<button type="button" data-goto="'+prev.id+'"><span class="dir">上一頁</span><span class="ttl">'+prev.title+'</span></button>':'<span></span>')+
    (next?'<button type="button" class="next" data-goto="'+next.id+'"><span class="dir">下一頁</span><span class="ttl">'+next.title+'</span></button>':'<span></span>')+
  '</nav>';
}
function buildToc(){
  const toc=document.getElementById('toc'); if(!toc) return;
  const hs=[...contentEl.querySelectorAll('.sec > h3')];
  if(!hs.length){toc.innerHTML='';return;}
  hs.forEach((h,i)=>{ if(!h.id) h.id='sec-'+i; });
  toc.innerHTML='<h4>本頁內容</h4><ul>'+hs.map(h=>'<li><a href="#'+h.id+'">'+h.textContent+'</a></li>').join('')+'</ul>';
  const links=[...toc.querySelectorAll('a')];
  if(window.IntersectionObserver){
    const io=new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){ links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+e.target.id)); } });
    },{rootMargin:'-20% 0px -70% 0px'});
    hs.forEach(h=>io.observe(h));
  }
}

/* 通用狀態流程圖：nodes 主鏈依序排列，edges 相鄰者畫直線、其餘畫弧線；dash＝自動或可選 */
function flowSvg(flow){
  const W=760, H=34, MINGAP=56;
  const nodes=[...flow.nodes];
  flow.edges.forEach(e=>{[e[0],e[1]].forEach(n=>{ if(!nodes.includes(n)) nodes.push(n); });});
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  // 長標籤折兩行，量寬
  const split=t=>{ t=String(t||''); if(t.length<=9) return [t]; const m=Math.ceil(t.length/2); return [t.slice(0,m),t.slice(m)]; };
  const lblW=t=>Math.max(...split(t).map(l=>l.length))*12.5+14;
  const idx=n=>nodes.indexOf(n);
  // 有同列向前跨越的弧線就把頂部留高
  const hasUp=flow.edges.some(e=>idx(e[1])>idx(e[0])+1);
  const TOP=hasUp?78:26, ROWGAP=hasUp?168:130;
  const wOf=t=>Math.max(72,t.length*14+26);
  const adjLabel=(a,b)=>{ const e=flow.edges.find(x=>x[0]===a&&x[1]===b); return e?e[2]:''; };
  const pos={}; let x=4,y=TOP,row=0;
  nodes.forEach((n,k)=>{
    const w=wOf(n);
    const gap=k<nodes.length-1?Math.max(MINGAP,lblW(adjLabel(n,nodes[k+1]))+16):0;
    if(k>0 && x+w>W-4){ x=4; y+=ROWGAP; row++; }
    pos[n]={x,y,w,row,cx:x+w/2,cy:y+H/2,gap};
    x+=w+gap;
  });
  const height=y+H+80;
  let out='';
  nodes.forEach(n=>{
    const p=pos[n]; const cls=/已完成|已確認可製作|製作等待中|成交/.test(n)?' end':(/已取消|流失|不合格|待改稿|待補件/.test(n)?' lost':'');
    out+='<rect class="fb'+cls+'" x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+H+'" rx="6"/>'+
         '<text class="ft'+cls+'" x="'+p.cx+'" y="'+(p.y+22)+'" text-anchor="middle">'+esc(n)+'</text>';
  });
  // 標籤先收集，最後做碰撞後處理再輸出
  const labels=[];
  const label=(t,x,yBase)=>{ const ls=split(t); if(!ls[0]) return ''; labels.push({ls,x,y:yBase-(ls.length-1)*7,w:lblW(t),h:ls.length*14}); return ''; };
  const emitLabels=()=>{
    const box=l=>({x:l.x-l.w/2,y:l.y-11,w:l.w,h:l.h});
    const hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
    for(let i=1;i<labels.length;i++){
      for(let t=0;t<3;t++){
        const bi=box(labels[i]); if(!labels.slice(0,i).some(o=>hit(bi,box(o)))) break;
        labels[i].y+=16;
      }
    }
    return labels.map(l=>'<text class="fl" x="'+l.x+'" y="'+l.y+'" text-anchor="middle">'+
      l.ls.map((ln,i)=>'<tspan x="'+l.x+'" dy="'+(i?14:0)+'">'+esc(ln)+'</tspan>').join('')+'</text>').join('');
  };
  const used={};
  flow.edges.forEach(e=>{
    const a=pos[e[0]], b=pos[e[1]]; if(!a||!b) return;
    const dash=e[3]?' dash':'';
    const ia=idx(e[0]), ib=idx(e[1]);
    let d, lx, ly;
    if(ib===ia+1 && a.row===b.row){
      d='M'+(a.x+a.w)+' '+a.cy+'H'+(b.x-2); lx=(a.x+a.w+b.x)/2; ly=a.cy-10;
    }else if(a.row===b.row){
      const up=ib>ia; const key=a.row+(up?'u':'d'); used[key]=(used[key]||0)+1; const k=used[key];
      const dy=(up?-1:1)*(30+(k-1)*30);
      const y0=up?a.y:a.y+H, y1=up?b.y-2:b.y+H+2;
      d='M'+a.cx+' '+y0+'C'+a.cx+' '+(y0+dy)+','+b.cx+' '+(y0+dy)+','+b.cx+' '+y1;
      lx=(a.cx+b.cx)/2; ly=y0+dy*0.75+(up?-2:14);
    }else{
      const key='x'+a.row+b.row; used[key]=(used[key]||0)+1; const k=used[key];
      const down=b.row>a.row;
      const y0=down?a.y+H:a.y, y1=down?b.y-2:b.y+H+2;
      const bend=(down?1:-1)*(ROWGAP/2);
      d='M'+a.cx+' '+y0+'C'+a.cx+' '+(y0+bend)+','+b.cx+' '+(y1-bend)+','+b.cx+' '+y1;
      lx=(a.cx+b.cx)/2+(k-1)*70*(k%2?1:-1); ly=(y0+y1)/2+4;
    }
    out+='<path class="fa'+dash+'" d="'+d+'" marker-end="url(#ah)"/>'; label(e[2],lx,ly);
  });
  out+=emitLabels();
  return '<figure class="flow"><svg viewBox="0 0 '+W+' '+height+'" role="img" aria-label="狀態流程圖">'+
    '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fm"/></marker></defs>'+out+'</svg>'+
    '<figcaption>'+(flow.caption||'方框是狀態，箭頭上的字是讓狀態往下走的事件。實線由人操作，虛線由系統自動推進或屬可選路徑。')+'</figcaption></figure>';
}

   }).join('')+
   '</div></section>'+
   '<section class="sec"><h3>怎麼使用這份手冊</h3>'+
   '<ol class="steps">'+
   '<li>左側先選單元，再選角色或流程，最後選主題。</li>'+
   '<li>每個單元先讀概覽，理解這段流程在解決什麼、各狀態在做什麼、誰負責哪一步。</li>'+
   '<li>操作說明頁給你情境、開始之前的條件、逐步操作與每一步的結果，最後列出預期結果與常見問題。</li>'+
   '<li>頂欄搜尋會同時比對主題標題與內文重點。</li>'+
   '</ol></section>'+
   '<section class="sec"><h3>角色一覽</h3>'+
   '<p class="lede">系統依角色開放不同功能。找到自己的角色，就知道要看哪幾個單元。</p>'+
   '<div class="table-wrap"><table>'+
   '<thead><tr><th>角色</th><th>在 ERP 上負責什麼</th><th>相關單元</th></tr></thead><tbody>'+
   ROLES.map(r=>'<tr><td style="white-space:nowrap;font-weight:600">'+r[0]+'</td><td>'+r[1]+'</td><td style="white-space:nowrap">'+r[2]+'</td></tr>').join('')+
   '</tbody></table></div></section>'+
   '<footer>本手冊依 ERP 現行流程撰寫，畫面文字以系統實際顯示為準。</footer>'+
   '</div>');
  contentEl.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{
    const t=b.dataset.open;
    if(t.indexOf('intro:')===0) renderUnitIntro(t.slice(6),true); else if(t) select(t,true);
  }));
  document.querySelectorAll('.scn-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.unit-intro-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('homeBtn').classList.add('active');
  buildToc();
}

function select(id,flash){
  renderScenario(id,flash);
}

/* ─── 事件 ─── */
buildNav();

navEl.addEventListener('click',e=>{
  const intro=e.target.closest('.unit-intro-btn');
  if(intro){
    renderUnitIntro(intro.dataset.intro,false);
    if(isNarrow()) document.querySelectorAll('.role-group').forEach(g=>g.classList.remove('open'));
    return;
  }
  const head=e.target.closest('.role-head');
  if(head){
    const group=head.parentElement;
    const willOpen=!group.classList.contains('open');
    if(isNarrow()) document.querySelectorAll('.role-group:not(.solo)').forEach(g=>g.classList.remove('open'));
    group.classList.toggle('open',willOpen);
    return;
  }
  const btn=e.target.closest('.scn-btn');
  if(btn) select(btn.dataset.scn,false);
});

document.getElementById('homeBtn').addEventListener('click',()=>{
  renderHome();
  window.scrollTo({top:0,behavior:noMotion?'auto':'smooth'});
});

document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){
    sidebarEl.classList.remove('filtered');
    document.querySelectorAll('.scn-btn').forEach(b=>b.parentElement.classList.remove('hidden'));
    document.querySelectorAll('.role-group').forEach(g=>g.classList.remove('hidden'));
    document.querySelectorAll('.unit').forEach(u=>u.classList.remove('hidden'));
    document.querySelectorAll('.unit-intro-btn').forEach(b=>b.classList.remove('hidden'));
    return;
  }
  sidebarEl.classList.add('filtered');
  document.querySelectorAll('.unit-intro-btn').forEach(b=>b.classList.add('hidden'));
  DATA.forEach(g=>{
    let hit=0;
    g.scenarios.forEach(s=>{
      const hay=(s.title+' '+(s.points||[]).join(' ')+' '+(s.goals||[]).join(' ')+' '+(s.story||'')+' '+s.intro+' '+g.role+' '+(s.notes||[]).map(n=>Array.isArray(n)?n.join(' '):n).join(' ')).toLowerCase();
      const li=document.querySelector('.scn-btn[data-scn="'+s.id+'"]').parentElement;
      const match=hay.indexOf(q)>=0;
      li.classList.toggle('hidden',!match);
      if(match) hit++;
    });
    document.querySelector('.role-group[data-role="'+g.key+'"]').classList.toggle('hidden',hit===0);
  });
  document.querySelectorAll('.unit').forEach(u=>{
    const live=u.querySelectorAll('.role-group:not(.hidden)').length;
    u.classList.toggle('hidden',live===0);
  });
});

/* 報頭高度回寫，供側欄吸附定位 */
const mastEl=document.querySelector('.masthead');
function syncHead(){
  document.documentElement.style.setProperty('--head-h',Math.round(mastEl.getBoundingClientRect().height)+'px');
}
syncHead();
if(window.ResizeObserver) new ResizeObserver(syncHead).observe(mastEl);
window.addEventListener('resize',syncHead);

/* 寬版預設展開第一個角色；窄版角色列為橫向捲動，不預先落下情境面板 */
/* 寬版全部展開；窄版收合。載入時視窗可能尚未定寬，故在 resize 時補做 */
/* 側欄為手風琴：預設全部收合，選到頁面時只展開該群組 */
renderHome();
</script>
